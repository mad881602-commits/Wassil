name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android Gradle Plugin 9.1.1
        run: |
          set -e
          TOML_FILE="gradle/libs.versions.toml"
          if [ ! -f "${TOML_FILE}" ]; then
            echo "ERROR: ${TOML_FILE} not found."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*agp[[:space:]]*=[[:space:]]*"9\.1\.1"[[:space:]]*$' "${TOML_FILE}"; then
            DETECTED_AGP=$(grep -E '^[[:space:]]*agp[[:space:]]*=' "${TOML_FILE}" || echo "not found")
            echo "ERROR: Expected agp = \"9.1.1\" in ${TOML_FILE}, but detected: ${DETECTED_AGP}"
            exit 1
          fi
          echo "Confirmed agp = \"9.1.1\" in ${TOML_FILE}."

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -e
          java -version
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          SDKMANAGER=$(find "${SDK_ROOT}" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null || true
          else
            mkdir -p "${SDK_ROOT}/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_ROOT}/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${SDK_ROOT}/licenses/android-sdk-preview-license"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate Release Signing Secrets and Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          MISSING=""
          if [ -z "${KEYSTORE_BASE64}" ]; then MISSING="${MISSING} KEYSTORE_BASE64"; fi
          if [ -z "${STORE_PASSWORD}" ]; then MISSING="${MISSING} STORE_PASSWORD"; fi
          if [ -z "${KEY_PASSWORD}" ]; then MISSING="${MISSING} KEY_PASSWORD"; fi
          if [ -z "${KEY_ALIAS}" ]; then MISSING="${MISSING} KEY_ALIAS"; fi

          if [ -n "${MISSING}" ]; then
            echo "ERROR: Missing required GitHub Actions Release signing secrets:${MISSING}"
            echo "Please add KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, and KEY_ALIAS under:"
            echo "Repository -> Settings -> Secrets and variables -> Actions."
            echo "Refusing to auto-generate a certificate or fall back to a debug keystore."
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/release-signing.jks"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE_FILE}"
          chmod 600 "${KEYSTORE_FILE}"

          if [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "ERROR: Decoded keystore file is empty. Verify KEYSTORE_BASE64 is valid Base64."
            exit 1
          fi

          # Validate keystore password and verify that the specified KEY_ALIAS exists
          if ! "${JAVA_HOME}/bin/keytool" -list \
            -keystore "${KEYSTORE_FILE}" \
            -storepass:env STORE_PASSWORD \
            -alias "${KEY_ALIAS}" > /dev/null 2>&1; then
            echo "ERROR: Unable to open keystore or find alias specified in KEY_ALIAS."
            echo "Verify STORE_PASSWORD, KEY_ALIAS, and KEYSTORE_BASE64."
            exit 1
          fi

          # app/build.gradle.kts expects keyAlias "upload" in signingConfigs.release.
          # If the user's keystore uses a different alias, map only the entry label in the
          # temporary runner copy (this keeps the exact same private key, certificate, and fingerprints).
          ALIAS_LOWER=$(printf '%s' "${KEY_ALIAS}" | tr '[:upper:]' '[:lower:]')
          if [ "${ALIAS_LOWER}" != "upload" ]; then
            "${JAVA_HOME}/bin/keytool" -changealias \
              -keystore "${KEYSTORE_FILE}" \
              -storepass:env STORE_PASSWORD \
              -keypass:env KEY_PASSWORD \
              -alias "${KEY_ALIAS}" \
              -destalias upload
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
          echo "Release keystore validated and prepared in temporary runner storage."

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Signed Release APK (Non-Debuggable & Release Certificate)
        run: |
          set -e
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${RELEASE_APK}" ] || [ ! -s "${RELEASE_APK}" ]; then
            echo "ERROR: Expected signed release APK not found or empty at ${RELEASE_APK}"
            find app/build/outputs/apk -name "*.apk" -print 2>/dev/null || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "${SDK_ROOT}/build-tools" -name "aapt2" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          APKSIGNER=$(find "${SDK_ROOT}/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -z "${AAPT2}" ] || [ -z "${APKSIGNER}" ]; then
            echo "ERROR: Android build-tools (aapt2 / apksigner) not found under ${SDK_ROOT}/build-tools."
            exit 1
          fi

          BADGING=$("${AAPT2}" dump badging "${RELEASE_APK}")
          echo "${BADGING}" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:" || true

          if ! echo "${BADGING}" | grep -q "package: name='com.aistudio.wassil.p2pshare'"; then
            echo "ERROR: Unexpected applicationId in built APK."
            exit 1
          fi

          if echo "${BADGING}" | grep -qx "application-debuggable"; then
            echo "ERROR: Built APK has application-debuggable set! Amazon Appstore requires a non-debuggable Release APK."
            exit 1
          fi

          SIGNER_INFO=$("${APKSIGNER}" verify --print-certs "${RELEASE_APK}")
          echo "${SIGNER_INFO}"

          if echo "${SIGNER_INFO}" | grep -qi "CN=Android Debug"; then
            echo "ERROR: APK is signed with an Android Debug certificate! A real Release signing certificate is required."
            exit 1
          fi

          echo "VERIFIED: ${RELEASE_APK} is a valid, non-debuggable, Release-signed APK."

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Signed Release APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_TAG="release-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="WASSIL Release APK #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Signed Release APK built by GitHub Actions for Amazon Appstore distribution.

          - Build Type: Release (non-debuggable)
          - Application ID: com.aistudio.wassil.p2pshare
          - Version: 1.0 (versionCode 1)
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - Source Commit SHA: ${GITHUB_SHA}"

          gh release create "${RELEASE_TAG}" "${SOURCE_APK}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Clean up temporary keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE_PATH}" ] && [ -f "${KEYSTORE_PATH}" ]; then
            rm -f "${KEYSTORE_PATH}"
            echo "Removed temporary keystore from runner storage."
          fi

      - name: Report Release APK result
        if: always()
        run: |
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            {
              echo "### Signed Release APK Ready"
              echo "- **Artifact Name:** \`app-release-apk\` (download directly from the **Artifacts** section of this workflow run)"
              echo "- **File:** \`app-release.apk\`"
              echo "- **Package:** \`com.aistudio.wassil.p2pshare\`"
              echo "- **Verified:** Non-debuggable Release APK signed with your Release Keystore"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
